<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- Purple-600 -->
      <stop offset="100%" stop-color="#db2777" /> <!-- Pink-600 -->
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Brain Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a78bfa" /> <!-- Violet-400 -->
    </linearGradient>
  </defs>

  <!-- Glowing Circular Background -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" />

  <!-- Glassmorphic Inner Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Robot Head / AI Outline -->
  <path d="M32 45 C32 35, 68 35, 68 45 C68 55, 68 62, 60 67 C54 71, 46 71, 40 67 C32 62, 32 55, 32 45 Z" 
        fill="rgba(10,5,25,0.4)" 
        stroke="rgba(255,255,255,0.5)" 
        stroke-width="2" 
        filter="url(#glow)" />

  <!-- Neon Glowing Eyes -->
  <ellipse cx="43" cy="48" rx="4" ry="2.5" fill="#38bdf8" filter="url(#glow)" />
  <ellipse cx="57" cy="48" rx="4" ry="2.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Bouncing Waves / Frequency Lines (Fintech Voice) -->
  <path d="M40 58 Q45 54 50 58 T60 58" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

  <!-- Sparkles / Stars (Generative AI Indicators) -->
  <!-- Top-Right Sparkle -->
  <path d="M72 26 L74 32 L80 34 L74 36 L72 42 L70 36 L64 34 L70 32 Z" fill="url(#sparkleGrad)" />
  
  <!-- Left Small Sparkle -->
  <path d="M22 36 L23 39 L26 40 L23 41 L22 44 L21 41 L18 40 L21 39 Z" fill="#ffffff" opacity="0.8" />
  
  <!-- Bottom Right Mini Sparkle -->
  <circle cx="70" cy="65" r="1.5" fill="#ffffff" />
  <circle cx="28" cy="68" r="2" fill="#ffffff" opacity="0.6" />
</svg>
